name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (Biome)
        run: pnpm check:ci
      - name: Typecheck
        run: pnpm typecheck
      # Unit + API tests. API tests run in workerd via vitest-pool-workers with local D1/R2 and a stubbed AI
      # binding, so no Cloudflare credentials are needed.
      - name: Test
        run: pnpm test

  # Split by device so they run side by side (one job took ~13 minutes, nearly all of it the tests). Each job
  # installs only its browser. The laptop is split again: the 3D games, drawn without a GPU here, run one at a time
  # in their own job so they don't starve each other or the rest of the suite. The offline check needs a production
  # build and Chromium, so it rides with the laptop's other tests.
  e2e-device:
    name: e2e (${{ matrix.device }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: laptop
            browser: chromium
            projects: --project=laptop
            group: other
            offline: true
          - device: laptop-games
            browser: chromium
            projects: --project=laptop
            group: games
          - device: ipad
            browser: webkit
            projects: --project=ipad --project=ipad-landscape
          - device: phone
            browser: webkit
            projects: --project=phone --project=phone-landscape
    env:
      # Remote bindings off: the dev server starts without Cloudflare credentials. Workers AI is unreachable, and
      # the tests stub speech and word info in the browser, so nothing is billed.
      JADE_LOCAL_ONLY: "1"
      E2E_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Throwaway dev vars (no real secrets)
        run: printf 'BETTER_AUTH_SECRET=ci-only-not-a-secret-%s\nBETTER_AUTH_URL=http://localhost:5190\n' "${{ github.run_id }}" > apps/web/.dev.vars
      - name: Local D1 migrations
        run: pnpm db:migrate:local
      # The browser download is cached by the lockfile (it pins Playwright's version); its system packages still
      # install every time, since the runner starts clean. Now and then apt stalls on the runner's mirror until the
      # job's limit, so each try gets 5 minutes (timeout kills the whole process group, apt included) and 3 tries.
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: |
          for try in 1 2 3; do
            timeout -k 15 300 pnpm --filter @jade/web exec playwright install --with-deps ${{ matrix.browser }} && exit 0
            echo "::warning::Playwright install try $try failed or stalled"
          done
          exit 1
      - name: Playwright system packages
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: |
          for try in 1 2 3; do
            timeout -k 15 300 pnpm --filter @jade/web exec playwright install-deps ${{ matrix.browser }} && exit 0
            echo "::warning::Playwright install try $try failed or stalled"
          done
          exit 1
      - name: e2e
        run: pnpm --filter @jade/web exec playwright test ${{ matrix.projects }}
      - name: e2e offline (production build, service worker)
        if: matrix.offline
        run: pnpm test:e2e:offline
      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.device }}
          path: apps/web/test-results
          retention-days: 7

  # The ruleset on main requires a check named "e2e": this one passes only when every device passed.
  e2e:
    if: always()
    needs: e2e-device
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every device passed
        run: test "${{ needs.e2e-device.result }}" = "success"
