<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
		<meta name="theme-color" content="#0e4f43" />
		<script>
			// Light the page before anything paints: the family's Day / Night choice, or the device's own on Auto (lib/theme.ts).
			(() => {
				var a = "auto";
				try { a = localStorage.getItem("jade.appearance") || "auto"; } catch (e) {}
				var t = a === "day" || a === "night" ? a : matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
				document.documentElement.dataset.theme = t;
				document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "day" ? "#d4ebe1" : "#0e4f43");
			})();
		</script>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Jade's World" />
		<meta name="description" content="Spelling bee and math practice for 8–11 year olds." />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<title>Jade's World</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
