<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Jade's World</title>
  <!-- Jade's World mark: a white vinyl "j" with a holographic foil star for its dot, over the three places stacked as the
       hub shows them. Authored SVG, no external source or font. Generated with the PNG icons; regenerate with
       apps/web/scripts/icons.sh. -->
  <defs>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#e6eaee"/>
      <stop offset="0.24" stop-color="#c3cff4"/>
      <stop offset="0.46" stop-color="#e6caee"/>
      <stop offset="0.68" stop-color="#c3ecda"/>
      <stop offset="1" stop-color="#eceff1"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="0.33" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.34" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="corner"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#corner)">
    <rect width="512" height="171" fill="#17795e"/>
    <rect y="171" width="512" height="170" fill="#b8326f"/>
    <rect y="341" width="512" height="171" fill="#5b4bc4"/>
    
    <rect width="512" height="512" fill="url(#gloss)" opacity="0.6"/>
  </g>

  <g transform="translate(256 256) scale(1) translate(-256 -256) rotate(-6 256 270)">
    <!-- lift shadow under the whole cut -->
    <g opacity="0.45" filter="url(#lift)" transform="translate(0 14)">
      <path d="M292 214 V318 Q292 388 226 388 Q196 388 178 372" fill="none" stroke="#06140f" stroke-width="130" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M292.0 54.0L314.3 97.3L362.4 105.1L328.1 139.7L335.5 187.9L292.0 166.0L248.5 187.9L255.9 139.7L221.6 105.1L269.7 97.3Z" fill="#06140f" stroke="#06140f" stroke-width="52" stroke-linejoin="round"/>
    </g>
    <!-- the white vinyl cut, following the letter and the star as one sticker -->
    <path d="M292 214 V318 Q292 388 226 388 Q196 388 178 372" fill="none" stroke="#fbfdfb" stroke-width="130" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M292.0 54.0L314.3 97.3L362.4 105.1L328.1 139.7L335.5 187.9L292.0 166.0L248.5 187.9L255.9 139.7L221.6 105.1L269.7 97.3Z" fill="#fbfdfb" stroke="#fbfdfb" stroke-width="52" stroke-linejoin="round"/>
    <path d="M292 160 V214" stroke="#fbfdfb" stroke-width="91" stroke-linecap="round"/>
    <!-- ink letter and foil dot -->
    <path d="M292 214 V318 Q292 388 226 388 Q196 388 178 372" fill="none" stroke="#1d2430" stroke-width="78" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M292.0 54.0L314.3 97.3L362.4 105.1L328.1 139.7L335.5 187.9L292.0 166.0L248.5 187.9L255.9 139.7L221.6 105.1L269.7 97.3Z" fill="#d6dcf6" stroke="#1d2430" stroke-width="9" stroke-linejoin="round"/>
  </g>
</svg>
