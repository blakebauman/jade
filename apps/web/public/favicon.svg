    </g>
    <path d="M292 214 V318 Q292 388 226 388 Q196 388 178 372" fill="none" stroke="#ffffff" stroke-width="156" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M292.0 58.0L313.2 98.9L358.6 106.4L326.2 139.1L333.1 184.6L292.0 164.0L250.9 184.6L257.8 139.1L225.4 106.4L270.8 98.9Z" fill="#ffffff" stroke="#ffffff" stroke-width="82" stroke-linejoin="round"/>
    <path d="M292 214 V318 Q292 388 226 388 Q196 388 178 372" fill="none" stroke="#d62c27" stroke-width="84" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M292.0 58.0L313.2 98.9L358.6 106.4L326.2 139.1L333.1 184.6L292.0 164.0L250.9 184.6L257.8 139.1L225.4 106.4L270.8 98.9Z" fill="#d62c27" stroke="#d62c27" stroke-width="10" stroke-linejoin="round"/>
